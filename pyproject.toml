[project]
name = "cshl-qb-course"
version = "0.1.0"
description = ""
authors = [{name = "Hou Lab CSHL", email = "the.hou.lab@gmail.com"}]
requires-python = ">=3.11,<3.12"
dependencies = [
    "ipython",
    "ipykernel",
    "ipywidgets",
    "jupyter",
    "pandas",
    "scipy",
    "pims",
    "seaborn",
    "opencv-contrib-python",
    "opencv-python",
    "opencv-python-headless",
    "plotly",
    "plotly-resampler",
    "pyarrow",
    "tqdm",
    "anywidget>=0.11.0",
    "matplotlib-scalebar>=0.9.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["projectlib"]
